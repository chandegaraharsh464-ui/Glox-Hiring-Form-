<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glox – Hiring Form</title>
<style>
:root{--bg:#f5f3ff;--card:#fff;--text:#1f1b2e;--muted:#6b6783;--line:#ddd6f3;--brand:#7c4dff;--brand2:#5b32d6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112a;--card:#1f1a3a;--text:#f1eeff;--muted:#a9a3c7;--line:#3a3361;--brand:#9a78ff;--brand2:#7c4dff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15112a;--card:#1f1a3a;--text:#f1eeff;--muted:#a9a3c7;--line:#3a3361;--brand:#9a78ff;--brand2:#7c4dff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
.wrap{max-width:620px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
header img{width:56px;height:56px;border-radius:14px}
h1{font-size:1.35rem;margin:0}
header p{margin:0;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
label:first-of-type{margin-top:0}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--brand);border-color:transparent}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.ok{display:none;margin-top:14px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--brand);font-size:.9rem}
</style></head>

</div>
<script>
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbx5JT5uuQcT3zSL14jv743GLwJfd-hrtYeAPq7G57ZOk9KEMu9esgVaJ60s5Gs7p_ZjnA/exec";
var form=document.getElementById("f"),btn=form.querySelector("button"),msg=document.getElementById("ok");
form.addEventListener("submit",function(e){
 e.preventDefault();
 if(!form.reportValidity())return;
 var v=function(i){return document.getElementById(i).value.trim()};
 var data={name:v("name"),email:v("email"),phone:v("phone"),role:v("role"),position:v("pos"),experience:v("exp"),address:v("addr"),age:v("age"),currentCtc:v("cctc"),expectedCtc:v("ectc"),noticePeriod:v("np"),reason:v("why"),industry:v("ind"),joining:v("join")};
 if(SCRIPT_URL.indexOf("http")!==0){msg.style.display="block";msg.textContent="Form is not connected yet. Please contact the company.";return}
 btn.disabled=true;btn.textContent="Submitting…";msg.style.display="none";
 fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(data)}).then(function(){
  form.reset();msg.style.display="block";msg.innerHTML="<b>Thank you!</b> Your form has been submitted. We will contact you soon.";
 }).catch(function(){
  msg.style.display="block";msg.textContent="Sorry, submission failed. Please check your internet and try again.";
 }).then(function(){btn.disabled=false;btn.textContent="Submit Form"});
});
</script></body></html>
